<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>User — Donate</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="./config.js"></script>

  <style>
    :root{
      --bg:#070707; --bg2:#0c0c0c;
      --card: rgba(255,255,255,.04);
      --stroke: rgba(212,175,55,.22);
      --stroke2: rgba(255,255,255,.10);
      --gold:#d4af37; --text:#f6f1df;
      --muted: rgba(246,241,223,.72);
      --shadow: 0 10px 40px rgba(0,0,0,.45);
      --radius: 18px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans Thai", sans-serif;
      background:
        radial-gradient(900px 600px at 20% 10%, rgba(212,175,55,.12), transparent 55%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      color:var(--text);
    }
    .wrap{max-width:1180px;margin:0 auto;padding:24px}
    #topbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
    .muted{color:var(--muted)}
    .card{
      background: var(--card);
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      padding:16px;
      box-shadow: var(--shadow);
    }
    .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
    .pill{
      display:inline-flex;gap:8px;align-items:center;
      padding:8px 12px;border-radius:999px;
      border:1px solid var(--stroke2);
      background: rgba(0,0,0,.35);
      color:var(--muted);
      font-size:12px;
    }
    .dot{width:8px;height:8px;border-radius:999px;background:var(--gold);box-shadow:0 0 18px rgba(212,175,55,.35)}
    input{
      width:100%;
      padding:12px;
      border-radius:14px;
      border:1px solid var(--stroke2);
      background: rgba(0,0,0,.35);
      color: var(--text);
      outline:none;
    }
    .btn{
      padding:10px 12px;border-radius:14px;
      border:1px solid rgba(212,175,55,.55);
      background: linear-gradient(180deg, rgba(212,175,55,.22), rgba(212,175,55,.12));
      color: var(--text);
      cursor:pointer;font-weight:900;
      transition:.15s transform ease;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn.secondary{
      border:1px solid var(--stroke2);
      background: rgba(255,255,255,.06);
      font-weight:800;
    }
    .sp{height:10px}
    table{width:100%;border-collapse:collapse}
    th,td{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
    th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:rgba(246,241,223,.55)}
    tr:hover td{background: rgba(212,175,55,.06)}
    .trail{max-height:420px;overflow:auto}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
  </style>
</head>

<body>
<div class="wrap">
  <div id="topbar">
    <div>
      <h2 style="margin:0">💸 User Donate</h2>
      <div class="muted">Role: <b id="role"></b> | Wallet: <b id="wallet"></b></div>
    </div>
    <div class="row">
      <button class="btn secondary" onclick="logout()">Logout</button>
      <button class="btn" onclick="loadAll()">Refresh</button>
    </div>
  </div>

  <div class="row" style="margin-top:14px">
    <div class="card" style="flex:1;min-width:320px">
      <div class="row">
        <div class="pill" id="net"><span class="dot"></span>Network: -</div>
        <div class="pill" id="addr"><span class="dot"></span>Wallet: -</div>
      </div>

      <div class="sp"></div>
      <div class="row">
        <span class="pill">Contract Balance: <b id="bal">-</b> ETH</span>
        <span class="pill">Total Donated: <b id="totalDonated">-</b> ETH</span>
        <span class="pill">Total Withdrawn: <b id="totalWithdrawn">-</b> ETH</span>
      </div>

      <div class="sp"></div>
      <label class="muted">จำนวน Sepolia ETH ที่จะบริจาค</label>
      <input id="eth" placeholder="เช่น 0.01" />
      <div class="sp"></div>
      <button class="btn" onclick="donate()">Donate</button>

      <div class="sp"></div>
      <div id="msg" class="muted"></div>
    </div>

    <div class="card" style="flex:1;min-width:320px">
      <h3 style="margin-top:0">🧾 เส้นทางการเงิน (Financial Trail)</h3>
      <div class="muted">ดูเส้นทางเงินจาก Event บนเชน (ล่าสุด 80 รายการ)</div>
      <div class="sp"></div>
      <div class="trail">
        <table>
          <thead>
            <tr><th>Time</th><th>Type</th><th>Detail</th></tr>
          </thead>
          <tbody id="trailRows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  guard("User");
  const $ = (id)=>document.getElementById(id);

  let provider, signer, contract, contractAddr;

  $('role').textContent = localStorage.getItem("role");
  $('wallet').textContent = short(localStorage.getItem("wallet"));

  function logout(){ localStorage.clear(); location.href="./index.html"; }
  function msg(t, ok=true){ setMsg($('msg'), t, ok); }

  async function connect(){
    try{
      if(!window.ethereum) return msg("ต้องมี MetaMask ก่อนนะ", false);

      contractAddr = assertContractAddress(ethers);
      provider = new ethers.providers.Web3Provider(window.ethereum);
      const accs = await provider.send("eth_accounts", []);
      if(!accs || !accs.length){
        await provider.send("eth_requestAccounts", []);
      }
      await assertIsContract(provider, contractAddr);

      signer = provider.getSigner();
      contract = new ethers.Contract(contractAddr, ABI, signer);

      const addr = await signer.getAddress();
      const net = await provider.getNetwork();
      if(net.chainId !== 11155111){
        throw new Error("กรุณาเปลี่ยน Network เป็น Sepolia Testnet (chainId: 11155111)");
      }

      const role = detectRole(addr);
      localStorage.setItem("logged_in","1");
      localStorage.setItem("wallet", addr);
      localStorage.setItem("role", role);
      if(role !== "User") return location.href="./index.html";

      $('addr').textContent = "Wallet: " + short(addr);
      $('net').textContent  = "Network: Sepolia ("+net.chainId+")";

      msg("เชื่อมต่อแล้ว ✅", true);
      await loadAll();
    }catch(e){
      msg(e?.data?.message || e.message, false);
    }
  }

  async function loadAll(){
    if(!contract){ await connect(); if(!contract) return msg("ยังไม่ได้เชื่อมต่อ MetaMask", false); }
    await Promise.all([refreshBalance(), loadTotalsAndTrail()]);
  }

  async function refreshBalance(){
    const balWei = await provider.getBalance(contractAddr);
    $('bal').textContent = ethers.utils.formatEther(balWei);
  }

  async function donate(){
    try{
      if(!contract) await connect();
      const eth = $('eth').value.trim();
      if(!eth) return msg("ใส่จำนวน Sepolia ETH ก่อน", false);

      const tx = await contract.donate({ value: ethers.utils.parseEther(eth) });
      msg("ส่งธุรกรรมแล้ว รอยืนยัน… ⛓️", true);
      await tx.wait();

      msg("บริจาคสำเร็จ 🎉", true);
      $('eth').value = "";
      await loadAll();
    }catch(e){
      msg(e?.data?.message || e.message, false);
    }
  }

  async function loadTotalsAndTrail(){
    try{
      const fromBlock = 0;

      const [donated, requested, approved, executed] = await Promise.all([
        contract.queryFilter(contract.filters.Donated(), fromBlock, "latest"),
        contract.queryFilter(contract.filters.WithdrawRequested(), fromBlock, "latest"),
        contract.queryFilter(contract.filters.WithdrawApproved(), fromBlock, "latest"),
        contract.queryFilter(contract.filters.WithdrawExecuted(), fromBlock, "latest"),
      ]);

      let totalDonatedWei = ethers.BigNumber.from(0);
      for(const ev of donated){ totalDonatedWei = totalDonatedWei.add(ev.args.amount); }

      let totalWithdrawnWei = ethers.BigNumber.from(0);
      for(const ev of executed){ totalWithdrawnWei = totalWithdrawnWei.add(ev.args.amount); }

      $('totalDonated').textContent = ethers.utils.formatEther(totalDonatedWei);
      $('totalWithdrawn').textContent = ethers.utils.formatEther(totalWithdrawnWei);

      const all = [];
      for(const ev of donated)  all.push({ type:"Donated", ev });
      for(const ev of requested)all.push({ type:"WithdrawRequested", ev });
      for(const ev of approved) all.push({ type:"WithdrawApproved", ev });
      for(const ev of executed) all.push({ type:"WithdrawExecuted", ev });

      all.sort((a,b)=>{
        if(a.ev.blockNumber !== b.ev.blockNumber) return a.ev.blockNumber - b.ev.blockNumber;
        if(a.ev.transactionIndex !== b.ev.transactionIndex) return a.ev.transactionIndex - b.ev.transactionIndex;
        return (a.ev.logIndex ?? 0) - (b.ev.logIndex ?? 0);
      });

      const blockNums = [...new Set(all.map(x=>x.ev.blockNumber))];
      const blockMap = new Map();
      for(const bn of blockNums){
        const blk = await provider.getBlock(bn);
        blockMap.set(bn, blk?.timestamp ? Number(blk.timestamp) : null);
      }

      const tbody = $('trailRows');
      tbody.innerHTML = "";

      const show = all.slice().reverse().slice(0, 80);
      for(const item of show){
        const ts = blockMap.get(item.ev.blockNumber);
        const timeStr = ts ? new Date(ts*1000).toLocaleString() : "-";
        const detail = buildTrailDetail(item.type, item.ev);

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="muted">${escapeHtml(timeStr)}</td>
          <td class="mono"><b>${escapeHtml(item.type)}</b></td>
          <td class="muted">${detail}</td>
        `;
        tbody.appendChild(tr);
      }
    }catch(e){
      const tbody = $('trailRows');
      if(tbody) tbody.innerHTML = `<tr><td colspan="3" class="muted">โหลด Trail ไม่สำเร็จ: ${escapeHtml(e?.message || "unknown")}</td></tr>`;
    }
  }

  function buildTrailDetail(type, ev){
    try{
      if(type === "Donated"){
        const from = ev.args.from;
        const amt = ethers.utils.formatEther(ev.args.amount);
        return `from ${short(from)} • amount ${amt} ETH`;
      }
      if(type === "WithdrawRequested"){
        const idx = ev.args.index?.toString?.() ?? "-";
        const requester = ev.args.requester;
        const amt = ethers.utils.formatEther(ev.args.amount);
        const purpose = ev.args.purpose || "";
        return `#${idx} requester ${short(requester)} • amount ${amt} ETH • "${escapeHtml(purpose)}"`;
      }
      if(type === "WithdrawApproved"){
        const idx = ev.args.index?.toString?.() ?? "-";
        const approver = ev.args.approver;
        const approvals = ev.args.approvals?.toString?.() ?? "-";
        return `#${idx} by ${short(approver)} • approvals=${approvals}`;
      }
      if(type === "WithdrawExecuted"){
        const idx = ev.args.index?.toString?.() ?? "-";
        const to = ev.args.to;
        const amt = ethers.utils.formatEther(ev.args.amount);
        const purpose = ev.args.purpose || "";
        return `#${idx} to ${short(to)} • amount ${amt} ETH • "${escapeHtml(purpose)}"`;
      }
      return "-";
    } catch {
      return "-";
    }
  }

  function escapeHtml(str){
    return (str||"").toString().replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
    }[m]));
  }

  window.addEventListener("DOMContentLoaded", ()=>{ try{ connect(); }catch(e){} });

  if(window.ethereum){
    window.ethereum.on("accountsChanged", ()=>location.href="./index.html");
    window.ethereum.on("chainChanged", ()=>location.reload());
  }
</script>
</body>
</html>
